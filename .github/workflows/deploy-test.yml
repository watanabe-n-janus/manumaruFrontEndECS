name: Deploy to Develop Environment

on:
  push:
    branches:
      - test
      - test-clean
      - develop
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  STACK_NAME: manumaruFrontECS-develop
  ENVIRONMENT: develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: develop  # Environment secretsを使用
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build React app
        env:
          REACT_APP_USER_POOL_ID: ${{ secrets.REACT_APP_USER_POOL_ID }}
          REACT_APP_USER_POOL_CLIENT_ID: ${{ secrets.REACT_APP_USER_POOL_CLIENT_ID }}
          REACT_APP_COGNITO_DOMAIN: ${{ secrets.REACT_APP_COGNITO_DOMAIN }}
          REACT_APP_AWS_REGION: ${{ secrets.REACT_APP_AWS_REGION || 'ap-northeast-1' }}
          REACT_APP_CALLBACK_URL: ${{ secrets.REACT_APP_CALLBACK_URL }}
          REACT_APP_SIGNOUT_URL: ${{ secrets.REACT_APP_SIGNOUT_URL }}
          REACT_APP_AWS_API_BASE_ENDPOINT: ${{ secrets.REACT_APP_AWS_API_BASE_ENDPOINT }}
          REACT_APP_AWS_API_KEY: ${{ secrets.REACT_APP_AWS_API_KEY }}
          REACT_APP_AWS_BUCKET_NAME: ${{ secrets.REACT_APP_AWS_BUCKET_NAME }}
          REACT_APP_DYNAMODB_TABLE_NAME: ${{ secrets.REACT_APP_DYNAMODB_TABLE_NAME }}
        run: |
          echo "Building React app with environment variables..."
          echo "Environment variables check (first 10 chars only for security):"
          echo "REACT_APP_USER_POOL_ID: ${REACT_APP_USER_POOL_ID:0:10}..."
          echo "REACT_APP_USER_POOL_CLIENT_ID: ${REACT_APP_USER_POOL_CLIENT_ID:0:10}..."
          echo "REACT_APP_COGNITO_DOMAIN: ${REACT_APP_COGNITO_DOMAIN:0:10}..."
          echo "REACT_APP_AWS_REGION: $REACT_APP_AWS_REGION"
          echo "REACT_APP_CALLBACK_URL: $REACT_APP_CALLBACK_URL"
          echo "REACT_APP_SIGNOUT_URL: $REACT_APP_SIGNOUT_URL"
          echo "REACT_APP_AWS_API_BASE_ENDPOINT: ${REACT_APP_AWS_API_BASE_ENDPOINT:0:30}..."
          echo "REACT_APP_AWS_API_KEY: ${REACT_APP_AWS_API_KEY:0:10}..."
          echo "REACT_APP_AWS_BUCKET_NAME: $REACT_APP_AWS_BUCKET_NAME"
          echo "REACT_APP_DYNAMODB_TABLE_NAME: $REACT_APP_DYNAMODB_TABLE_NAME"
          echo ""
          echo "Starting build..."
          npm run build
          
          if [ ! -d "build" ]; then
            echo "❌ Error: Build directory not found"
            exit 1
          fi
          
          echo "✓ Build completed successfully"
          echo "Build size: $(du -sh build | cut -f1)"

      - name: Check AWS secrets (detailed)
        run: |
          echo "=========================================="
          echo "AWS Secrets Check (develop environment)"
          echo "=========================================="
          
          # Environment情報を確認
          echo "Environment: ${{ job.environment }}"
          echo "GitHub Context:"
          echo "  - Repository: ${{ github.repository }}"
          echo "  - Ref: ${{ github.ref }}"
          echo "  - Event: ${{ github.event_name }}"
          
          # Secretsの存在確認（値は表示しない）
          AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          AWS_REGION="${{ secrets.AWS_REGION || env.AWS_REGION }}"
          
          echo ""
          echo "Secrets check:"
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "❌ AWS_ACCESS_KEY_ID: NOT SET"
            echo "   → GitHub Environment 'develop' で 'AWS_ACCESS_KEY_ID' が設定されていません"
            echo "   → Settings > Environments > develop > Add secret で設定してください"
            exit 1
          else
            echo "✓ AWS_ACCESS_KEY_ID: SET (length: ${#AWS_ACCESS_KEY_ID} chars)"
            echo "  First 10 chars: ${AWS_ACCESS_KEY_ID:0:10}..."
          fi
          
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "❌ AWS_SECRET_ACCESS_KEY: NOT SET"
            echo "   → GitHub Environment 'develop' で 'AWS_SECRET_ACCESS_KEY' が設定されていません"
            echo "   → Settings > Environments > develop > Add secret で設定してください"
            exit 1
          else
            echo "✓ AWS_SECRET_ACCESS_KEY: SET (length: ${#AWS_SECRET_ACCESS_KEY} chars)"
            echo "  First 10 chars: ${AWS_SECRET_ACCESS_KEY:0:10}..."
          fi
          
          echo "✓ AWS_REGION: $AWS_REGION"
          echo ""
          echo "=========================================="
          echo "All AWS secrets are configured"
          echo "=========================================="

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}
        continue-on-error: true
        id: aws-config

      - name: Verify AWS credentials
        if: steps.aws-config.outcome == 'success'
        run: |
          echo "=========================================="
          echo "Verifying AWS credentials..."
          echo "=========================================="
          
          # AWS認証情報の検証
          echo "Testing AWS authentication..."
          AWS_IDENTITY=$(aws sts get-caller-identity 2>&1)
          AWS_EXIT_CODE=$?
          
          if [ $AWS_EXIT_CODE -ne 0 ]; then
            echo "❌ Error: Failed to authenticate with AWS"
            echo "Error details:"
            echo "$AWS_IDENTITY"
            echo ""
            echo "Possible causes:"
            echo "1. AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY is incorrect"
            echo "2. AWS credentials have expired or been revoked"
            echo "3. IAM user/role doesn't have necessary permissions"
            echo "4. AWS region is incorrect"
            exit 1
          fi
          
          echo "✓ AWS credentials verified"
          echo "AWS Identity:"
          echo "$AWS_IDENTITY" | jq '.' || echo "$AWS_IDENTITY"
          
      - name: AWS credentials configuration failed
        if: steps.aws-config.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "❌ AWS Credentials Configuration Failed"
          echo "=========================================="
          echo ""
          echo "The aws-actions/configure-aws-credentials action failed."
          echo ""
          echo "Troubleshooting steps:"
          echo "1. Check if 'AWS_ACCESS_KEY_ID' is set in GitHub Environment 'develop':"
          echo "   → Settings > Environments > develop > Secrets"
          echo ""
          echo "2. Check if 'AWS_SECRET_ACCESS_KEY' is set in GitHub Environment 'develop':"
          echo "   → Settings > Environments > develop > Secrets"
          echo ""
          echo "3. Verify the secrets are not empty:"
          echo "   → The secrets should have values (not empty strings)"
          echo ""
          echo "4. Check if the environment name matches:"
          echo "   → Workflow uses: environment: develop"
          echo "   → GitHub Environment should be named: 'develop'"
          echo ""
          echo "5. If using Repository Secrets instead of Environment Secrets:"
          echo "   → Remove 'environment: develop' from the workflow"
          echo "   → Or move secrets from Repository Secrets to Environment Secrets"
          echo ""
          exit 1

      - name: Deploy CloudFormation stack
        run: |
          cd cloudformation
          
          # CloudFormationテンプレートの検証
          echo "Validating CloudFormation template..."
          aws cloudformation validate-template \
            --template-body file://templates/main.yaml \
            > /dev/null
          
          if [ $? -ne 0 ]; then
            echo "❌ Template validation failed"
            exit 1
          fi
          echo "✓ Template validation successful"
          
          # スタックの存在確認とデプロイ
          STACK_NAME="manumaruFrontECS-develop"
          PARAMETER_FILE="parameters/develop.json"
          
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" > /dev/null 2>&1; then
            echo "Stack exists, updating..."
            aws cloudformation update-stack \
              --stack-name "$STACK_NAME" \
              --template-body file://templates/main.yaml \
              --parameters file://$PARAMETER_FILE \
              --capabilities CAPABILITY_NAMED_IAM || {
                # 更新が不要な場合（No updates are to be performed）は正常終了
                if aws cloudformation describe-stack-events \
                  --stack-name "$STACK_NAME" \
                  --max-items 1 \
                  --query 'StackEvents[0].ResourceStatus' \
                  --output text | grep -q "UPDATE_COMPLETE\|CREATE_COMPLETE"; then
                  echo "✓ Stack is up to date"
                else
                  exit 1
                fi
              }
            
            echo "Waiting for stack update to complete..."
            aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME" || true
          else
            echo "Stack does not exist, creating..."
            aws cloudformation create-stack \
              --stack-name "$STACK_NAME" \
              --template-body file://templates/main.yaml \
              --parameters file://$PARAMETER_FILE \
              --capabilities CAPABILITY_NAMED_IAM
            
            echo "Waiting for stack creation to complete..."
            aws cloudformation wait stack-create-complete --stack-name "$STACK_NAME"
          fi
          
          echo "✓ CloudFormation stack deployment completed"

      - name: Get S3 bucket name from CloudFormation
        id: get-s3-bucket
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`S3BucketName`].OutputValue' \
            --output text)
          if [ -z "$BUCKET_NAME" ] || [ "$BUCKET_NAME" == "None" ]; then
            echo "❌ Error: S3 bucket name not found in CloudFormation outputs"
            exit 1
          fi
          echo "bucket=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "S3 Bucket: $BUCKET_NAME"

      - name: Sync build files to S3
        run: |
          BUCKET_NAME="${{ steps.get-s3-bucket.outputs.bucket }}"
          
          echo "Syncing build files to S3 bucket: $BUCKET_NAME"
          
          # Static assets with long cache
          aws s3 sync build/ s3://$BUCKET_NAME/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "service-worker.js" \
            --exclude "manifest.json" \
            --exclude "*.map"
          
          # HTML files and service worker should not be cached
          aws s3 sync build/ s3://$BUCKET_NAME/ \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --include "service-worker.js" \
            --include "manifest.json"
          
          # Source maps (optional, for debugging)
          if find build -name "*.map" | grep -q .; then
            aws s3 sync build/ s3://$BUCKET_NAME/ \
              --cache-control "public, max-age=0, no-cache" \
              --include "*.map"
          fi
          
          echo "✓ Files synced to S3 successfully"

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
            --output text)
          
          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" == "None" ]; then
            echo "❌ Error: CloudFront Distribution ID not found in CloudFormation outputs"
            exit 1
          fi
          
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          
          echo "CloudFront invalidation created: $INVALIDATION_ID"
          echo "Waiting for invalidation to complete..."
          
          aws cloudfront wait invalidation-completed \
            --distribution-id $DISTRIBUTION_ID \
            --id $INVALIDATION_ID

      - name: Get CloudFront URL
        run: |
          CLOUDFRONT_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontURL`].OutputValue' \
            --output text)
          echo "🚀 Deployment completed!"
          echo "CloudFront URL: $CLOUDFRONT_URL"

