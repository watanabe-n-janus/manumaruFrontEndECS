name: Deploy to Develop Environment

on:
  push:
    branches:
      - test
      - test-clean
      - develop
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  STACK_NAME: manumaruFrontECS-develop
  ENVIRONMENT: develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: develop  # Environment secretsを使用
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build React app
        env:
          REACT_APP_USER_POOL_ID: ${{ secrets.REACT_APP_USER_POOL_ID }}
          REACT_APP_USER_POOL_CLIENT_ID: ${{ secrets.REACT_APP_USER_POOL_CLIENT_ID }}
          REACT_APP_COGNITO_DOMAIN: ${{ secrets.REACT_APP_COGNITO_DOMAIN }}
          REACT_APP_AWS_REGION: ${{ secrets.REACT_APP_AWS_REGION || 'ap-northeast-1' }}
          REACT_APP_CALLBACK_URL: ${{ secrets.REACT_APP_CALLBACK_URL }}
          REACT_APP_SIGNOUT_URL: ${{ secrets.REACT_APP_SIGNOUT_URL }}
          REACT_APP_AWS_API_BASE_ENDPOINT: ${{ secrets.REACT_APP_AWS_API_BASE_ENDPOINT }}
          REACT_APP_AWS_API_KEY: ${{ secrets.REACT_APP_AWS_API_KEY }}
          REACT_APP_AWS_BUCKET_NAME: ${{ secrets.REACT_APP_AWS_BUCKET_NAME }}
          REACT_APP_DYNAMODB_TABLE_NAME: ${{ secrets.REACT_APP_DYNAMODB_TABLE_NAME }}
          REACT_APP_AWS_ACCESS_KEY_ID: ${{ secrets.REACT_APP_AWS_ACCESS_KEY_ID }}
          REACT_APP_AWS_SECRET_ACCESS_KEY: ${{ secrets.REACT_APP_AWS_SECRET_ACCESS_KEY }}
          REACT_APP_COGNITO_HOSTED_UI_URL: ${{ secrets.REACT_APP_COGNITO_HOSTED_UI_URL }}
        run: |
          echo "Building React app with environment variables..."
          echo "Environment variables check (first 10 chars only for security):"
          echo "REACT_APP_USER_POOL_ID: ${REACT_APP_USER_POOL_ID:0:10}..."
          echo "REACT_APP_USER_POOL_CLIENT_ID: ${REACT_APP_USER_POOL_CLIENT_ID:0:10}..."
          echo "REACT_APP_COGNITO_DOMAIN: ${REACT_APP_COGNITO_DOMAIN:0:10}..."
          echo "REACT_APP_AWS_REGION: $REACT_APP_AWS_REGION"
          echo "REACT_APP_CALLBACK_URL: $REACT_APP_CALLBACK_URL"
          echo "REACT_APP_SIGNOUT_URL: $REACT_APP_SIGNOUT_URL"
          echo "REACT_APP_AWS_API_BASE_ENDPOINT: ${REACT_APP_AWS_API_BASE_ENDPOINT:0:30}..."
          echo "REACT_APP_AWS_API_KEY: ${REACT_APP_AWS_API_KEY:0:10}..."
          echo "REACT_APP_AWS_BUCKET_NAME: $REACT_APP_AWS_BUCKET_NAME"
          echo "REACT_APP_DYNAMODB_TABLE_NAME: $REACT_APP_DYNAMODB_TABLE_NAME"
          echo "REACT_APP_AWS_ACCESS_KEY_ID: ${REACT_APP_AWS_ACCESS_KEY_ID:0:10}..."
          echo "REACT_APP_AWS_SECRET_ACCESS_KEY: ${REACT_APP_AWS_SECRET_ACCESS_KEY:0:10}..."
          echo "REACT_APP_COGNITO_HOSTED_UI_URL: ${REACT_APP_COGNITO_HOSTED_UI_URL:0:30}..."
          echo ""
          echo "Starting build..."
          npm run build
          
          if [ ! -d "build" ]; then
            echo "❌ Error: Build directory not found"
            exit 1
          fi
          
          echo "✓ Build completed successfully"
          echo "Build size: $(du -sh build | cut -f1)"

      - name: Check AWS secrets (detailed)
        run: |
          echo "=========================================="
          echo "AWS Secrets Check (develop environment)"
          echo "=========================================="
          
          # Environment情報を確認
          echo "Environment: ${{ job.environment }}"
          echo "GitHub Context:"
          echo "  - Repository: ${{ github.repository }}"
          echo "  - Ref: ${{ github.ref }}"
          echo "  - Event: ${{ github.event_name }}"
          
          # Secretsの存在確認（値は表示しない）
          AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          AWS_REGION="${{ secrets.AWS_REGION || env.AWS_REGION }}"
          
          # 前後の空白を削除
          AWS_ACCESS_KEY_ID=$(echo "$AWS_ACCESS_KEY_ID" | xargs)
          AWS_SECRET_ACCESS_KEY=$(echo "$AWS_SECRET_ACCESS_KEY" | xargs)
          
          echo ""
          echo "Secrets check:"
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ "$AWS_ACCESS_KEY_ID" == "" ]; then
            echo "❌ AWS_ACCESS_KEY_ID: NOT SET or EMPTY"
            echo "   → GitHub Environment 'develop' で 'AWS_ACCESS_KEY_ID' が設定されていません"
            echo "   → Settings > Environments > develop > Add secret で設定してください"
            echo "   → 値が空文字列でないことを確認してください"
            exit 1
          else
            echo "✓ AWS_ACCESS_KEY_ID: SET (length: ${#AWS_ACCESS_KEY_ID} chars)"
            echo "  First 10 chars: ${AWS_ACCESS_KEY_ID:0:10}..."
            # 一般的なAWSアクセスキーIDの形式チェック（AKIAで始まる）
            if [[ ! "$AWS_ACCESS_KEY_ID" =~ ^AKIA[0-9A-Z]{16}$ ]]; then
              echo "  ⚠️  Warning: AWS_ACCESS_KEY_ID format may be incorrect (should start with AKIA and be 20 chars)"
            fi
          fi
          
          if [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ "$AWS_SECRET_ACCESS_KEY" == "" ]; then
            echo "❌ AWS_SECRET_ACCESS_KEY: NOT SET or EMPTY"
            echo "   → GitHub Environment 'develop' で 'AWS_SECRET_ACCESS_KEY' が設定されていません"
            echo "   → Settings > Environments > develop > Add secret で設定してください"
            echo "   → 値が空文字列でないことを確認してください"
            exit 1
          else
            echo "✓ AWS_SECRET_ACCESS_KEY: SET (length: ${#AWS_SECRET_ACCESS_KEY} chars)"
            echo "  First 10 chars: ${AWS_SECRET_ACCESS_KEY:0:10}..."
            # 一般的なAWSシークレットキーの長さチェック（40文字）
            if [ ${#AWS_SECRET_ACCESS_KEY} -lt 30 ] || [ ${#AWS_SECRET_ACCESS_KEY} -gt 50 ]; then
              echo "  ⚠️  Warning: AWS_SECRET_ACCESS_KEY length may be incorrect (typically 40 chars)"
            fi
          fi
          
          echo "✓ AWS_REGION: $AWS_REGION"
          echo ""
          echo "=========================================="
          echo "All AWS secrets are configured"
          echo "=========================================="

      - name: Validate AWS credentials format
        run: |
          echo "=========================================="
          echo "Validating AWS Credentials Format"
          echo "=========================================="
          
          AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          
          # 前後の空白を削除
          AWS_ACCESS_KEY_ID=$(echo "$AWS_ACCESS_KEY_ID" | xargs)
          AWS_SECRET_ACCESS_KEY=$(echo "$AWS_SECRET_ACCESS_KEY" | xargs)
          
          echo "AWS_ACCESS_KEY_ID validation:"
          echo "  Length: ${#AWS_ACCESS_KEY_ID} chars"
          echo "  Expected: 20 chars (format: AKIA followed by 16 alphanumeric chars)"
          echo "  First 4 chars: ${AWS_ACCESS_KEY_ID:0:4}"
          
          if [[ ! "$AWS_ACCESS_KEY_ID" =~ ^AKIA[0-9A-Z]{16}$ ]]; then
            echo "  ❌ Format validation failed"
            echo "  → AWS_ACCESS_KEY_ID should start with 'AKIA' and be exactly 20 characters"
            echo "  → Current value may be incorrect or contain invalid characters"
          else
            echo "  ✓ Format validation passed"
          fi
          
          echo ""
          echo "AWS_SECRET_ACCESS_KEY validation:"
          echo "  Length: ${#AWS_SECRET_ACCESS_KEY} chars"
          echo "  Expected: 40 chars (base64-like string)"
          
          if [ ${#AWS_SECRET_ACCESS_KEY} -lt 35 ] || [ ${#AWS_SECRET_ACCESS_KEY} -gt 45 ]; then
            echo "  ❌ Length validation failed"
            echo "  → AWS_SECRET_ACCESS_KEY should be approximately 40 characters"
            echo "  → Current length (${#AWS_SECRET_ACCESS_KEY}) is outside expected range"
          else
            echo "  ✓ Length validation passed"
          fi
          
          # 空白や改行が含まれていないかチェック
          if [[ "$AWS_ACCESS_KEY_ID" =~ [[:space:]] ]]; then
            echo "  ⚠️  Warning: AWS_ACCESS_KEY_ID contains whitespace"
          fi
          if [[ "$AWS_SECRET_ACCESS_KEY" =~ [[:space:]] ]]; then
            echo "  ⚠️  Warning: AWS_SECRET_ACCESS_KEY contains whitespace"
          fi
          
          echo ""
          echo "=========================================="

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}
        continue-on-error: true
        id: aws-config

      - name: Verify AWS credentials
        if: steps.aws-config.outcome == 'success'
        run: |
          echo "=========================================="
          echo "Verifying AWS credentials..."
          echo "=========================================="
          
          # AWS認証情報の検証
          echo "Testing AWS authentication..."
          AWS_IDENTITY=$(aws sts get-caller-identity 2>&1)
          AWS_EXIT_CODE=$?
          
          if [ $AWS_EXIT_CODE -ne 0 ]; then
            echo "❌ Error: Failed to authenticate with AWS"
            echo "Error details:"
            echo "$AWS_IDENTITY"
            echo ""
            echo "Possible causes:"
            echo "1. AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY is incorrect"
            echo "2. AWS credentials have expired or been revoked"
            echo "3. IAM user/role doesn't have necessary permissions"
            echo "4. AWS region is incorrect"
            exit 1
          fi
          
          echo "✓ AWS credentials verified"
          echo "AWS Identity:"
          echo "$AWS_IDENTITY" | jq '.' || echo "$AWS_IDENTITY"
          
      - name: AWS credentials configuration failed
        if: steps.aws-config.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "❌ AWS Credentials Configuration Failed"
          echo "=========================================="
          echo ""
          echo "Error: The request signature we calculated does not match the signature you provided."
          echo ""
          echo "This error typically means:"
          echo "1. AWS_SECRET_ACCESS_KEY is incorrect"
          echo "2. AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY don't match"
          echo "3. The credentials have been rotated or revoked"
          echo "4. There are extra spaces or characters in the secret values"
          echo ""
          echo "Troubleshooting steps:"
          echo ""
          echo "1. Verify AWS credentials in AWS Console:"
          echo "   → Go to AWS IAM Console"
          echo "   → Users > [Your IAM User] > Security credentials"
          echo "   → Check if the access key is active"
          echo "   → If needed, create a new access key"
          echo ""
          echo "2. Re-enter the secrets in GitHub:"
          echo "   → Settings > Environments > develop > Secrets"
          echo "   → Delete AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY"
          echo "   → Add them again, making sure to:"
          echo "     - Copy the entire value (no spaces before/after)"
          echo "     - Don't include any line breaks"
          echo "     - Copy directly from AWS Console (don't type manually)"
          echo ""
          echo "3. Verify the format:"
          echo "   → AWS_ACCESS_KEY_ID: Should be 20 chars, starting with 'AKIA'"
          echo "   → AWS_SECRET_ACCESS_KEY: Should be 40 chars (base64-like)"
          echo ""
          echo "4. Check if credentials are for the correct AWS account:"
          echo "   → Make sure you're using credentials for the develop environment's AWS account"
          echo ""
          echo "5. Test credentials locally (if you have AWS CLI):"
          echo "   → aws configure set aws_access_key_id YOUR_ACCESS_KEY"
          echo "   → aws configure set aws_secret_access_key YOUR_SECRET_KEY"
          echo "   → aws sts get-caller-identity"
          echo "   → If this fails, the credentials are incorrect"
          echo ""
          exit 1

      - name: Deploy CloudFormation stack
        run: |
          cd cloudformation
          
          # CloudFormationテンプレートの検証
          echo "Validating CloudFormation template..."
          aws cloudformation validate-template \
            --template-body file://templates/main.yaml \
            > /dev/null
          
          if [ $? -ne 0 ]; then
            echo "❌ Template validation failed"
            exit 1
          fi
          echo "✓ Template validation successful"
          
          # スタックの存在確認とデプロイ
          STACK_NAME="manumaruFrontECS-develop"
          PARAMETER_FILE="parameters/develop.json"
          
          # スタックの状態を確認
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" > /dev/null 2>&1; then
            STACK_STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query 'Stacks[0].StackStatus' \
              --output text)
            
            echo "Stack exists with status: $STACK_STATUS"
            
            # ROLLBACK_COMPLETE状態の場合は削除して再作成
            if [ "$STACK_STATUS" == "ROLLBACK_COMPLETE" ] || [ "$STACK_STATUS" == "DELETE_FAILED" ] || [ "$STACK_STATUS" == "CREATE_FAILED" ]; then
              echo "⚠️  Stack is in $STACK_STATUS state and cannot be updated"
              echo "Deleting stack for recreation..."
              
              aws cloudformation delete-stack --stack-name "$STACK_NAME"
              echo "Waiting for stack deletion to complete..."
              aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" || {
                echo "⚠️  Stack deletion may have failed or is still in progress"
                echo "Waiting additional time..."
                sleep 30
              }
              
              echo "Creating new stack..."
              aws cloudformation create-stack \
                --stack-name "$STACK_NAME" \
                --template-body file://templates/main.yaml \
                --parameters file://$PARAMETER_FILE \
                --capabilities CAPABILITY_NAMED_IAM
              
              echo "Waiting for stack creation to complete..."
              aws cloudformation wait stack-create-complete --stack-name "$STACK_NAME" || {
                echo "❌ Stack creation failed. Checking events..."
                aws cloudformation describe-stack-events \
                  --stack-name "$STACK_NAME" \
                  --max-items 10 \
                  --query 'StackEvents[?ResourceStatus==`CREATE_FAILED`].[LogicalResourceId,ResourceStatusReason]' \
                  --output table
                exit 1
              }
            else
              # 通常の更新処理
              echo "Updating stack..."
              echo "Stack name: $STACK_NAME"
              echo "Parameter file: $PARAMETER_FILE"
              
              # パラメータファイルの内容を確認
              if [ -f "$PARAMETER_FILE" ]; then
                echo "Parameters:"
                cat "$PARAMETER_FILE"
              else
                echo "⚠️  Parameter file not found: $PARAMETER_FILE"
              fi
              
              # update-stackコマンドを実行（エラーも含めて出力を取得）
              set +e  # エラーで即座に終了しないようにする
              UPDATE_OUTPUT=$(aws cloudformation update-stack \
                --stack-name "$STACK_NAME" \
                --template-body file://templates/main.yaml \
                --parameters file://$PARAMETER_FILE \
                --capabilities CAPABILITY_NAMED_IAM 2>&1)
              UPDATE_EXIT_CODE=$?
              set -e  # エラーで即座に終了するように戻す
              
              echo ""
              echo "=========================================="
              echo "Update stack command result:"
              echo "=========================================="
              echo "Exit code: $UPDATE_EXIT_CODE"
              echo "Output:"
              echo "$UPDATE_OUTPUT"
              echo "=========================================="
              echo ""
              
              if [ $UPDATE_EXIT_CODE -eq 0 ]; then
                echo "✓ Stack update initiated successfully"
                echo "Stack ID: $(echo "$UPDATE_OUTPUT" | grep -oP 'arn:aws:cloudformation:[^ ]+' || echo 'N/A')"
                
                echo "Waiting for stack update to complete..."
                echo "This may take several minutes..."
                
                # waitコマンドのタイムアウトを設定（30分）
                if timeout 1800 aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME" 2>&1; then
                  echo "✓ Stack update completed successfully"
                else
                  WAIT_EXIT_CODE=$?
                  echo ""
                  echo "❌ Stack update wait failed or timed out (exit code: $WAIT_EXIT_CODE)"
                  echo "Checking stack status..."
                  
                  # スタックの状態を確認
                  FINAL_STATUS=$(aws cloudformation describe-stacks \
                    --stack-name "$STACK_NAME" \
                    --query 'Stacks[0].StackStatus' \
                    --output text 2>&1)
                  
                  echo ""
                  echo "=========================================="
                  echo "Current stack status: $FINAL_STATUS"
                  echo "=========================================="
                  
                  # スタックの詳細情報を取得
                  echo ""
                  echo "Stack details:"
                  aws cloudformation describe-stacks \
                    --stack-name "$STACK_NAME" \
                    --query 'Stacks[0].{Status:StackStatus,StatusReason:StackStatusReason,LastUpdated:LastUpdatedTime}' \
                    --output table 2>&1 || echo "Failed to get stack details"
                  
                  # 失敗したリソースを確認
                  echo ""
                  echo "=========================================="
                  echo "Failed resources:"
                  echo "=========================================="
                  aws cloudformation describe-stack-events \
                    --stack-name "$STACK_NAME" \
                    --max-items 20 \
                    --query 'StackEvents[?ResourceStatus==`UPDATE_FAILED` || ResourceStatus==`UPDATE_ROLLBACK_COMPLETE`].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
                    --output table 2>&1 || echo "No failed resources found or failed to get events"
                  
                  # 最新のエラーイベントを表示
                  echo ""
                  echo "=========================================="
                  echo "Recent error events (last 10):"
                  echo "=========================================="
                  aws cloudformation describe-stack-events \
                    --stack-name "$STACK_NAME" \
                    --max-items 10 \
                    --query 'StackEvents[?contains(ResourceStatus, `FAILED`) || contains(ResourceStatus, `ROLLBACK`)].{Time:Timestamp,Resource:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
                    --output table 2>&1 || echo "No error events found or failed to get events"
                  
                  # すべての最新イベントを表示（デバッグ用）
                  echo ""
                  echo "=========================================="
                  echo "All recent stack events (last 10):"
                  echo "=========================================="
                  aws cloudformation describe-stack-events \
                    --stack-name "$STACK_NAME" \
                    --max-items 10 \
                    --query 'StackEvents[].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
                    --output table 2>&1 || echo "Failed to get stack events"
                  
                  if [ "$FINAL_STATUS" == "UPDATE_ROLLBACK_COMPLETE" ] || [ "$FINAL_STATUS" == "UPDATE_ROLLBACK_FAILED" ]; then
                    echo ""
                    echo "⚠️  Stack update was rolled back. The stack is in a stable state but the update failed."
                    echo "Please check the error messages above and fix the issues before retrying."
                  elif [ "$FINAL_STATUS" == "UPDATE_IN_PROGRESS" ]; then
                    echo ""
                    echo "⚠️  Stack update is still in progress. The wait command may have timed out."
                    echo "Please check the AWS console for the current status."
                  fi
                  
                  exit 1
                fi
              elif echo "$UPDATE_OUTPUT" | grep -qi "No updates are to be performed"; then
                echo "✓ Stack is up to date (no changes detected)"
                echo "This means the current stack configuration matches the template."
              else
                echo ""
                echo "=========================================="
                echo "❌ Stack update command failed"
                echo "=========================================="
                echo "Exit code: $UPDATE_EXIT_CODE"
                echo ""
                echo "Error output:"
                echo "$UPDATE_OUTPUT"
                echo ""
                
                # エラーメッセージの種類を確認
                if echo "$UPDATE_OUTPUT" | grep -qi "ValidationError"; then
                  echo "Error type: Validation Error"
                  echo "This usually means there's an issue with the template or parameters."
                elif echo "$UPDATE_OUTPUT" | grep -qi "AccessDenied"; then
                  echo "Error type: Access Denied"
                  echo "This usually means the IAM user/role doesn't have necessary permissions."
                elif echo "$UPDATE_OUTPUT" | grep -qi "InvalidParameterValue"; then
                  echo "Error type: Invalid Parameter Value"
                  echo "This usually means one of the parameters has an invalid value."
                elif echo "$UPDATE_OUTPUT" | grep -qi "Resource.*cannot be updated"; then
                  echo "Error type: Resource Update Not Allowed"
                  echo "This usually means the resource doesn't support the requested change."
                fi
                
                echo ""
                echo "Checking current stack status..."
                CURRENT_STATUS=$(aws cloudformation describe-stacks \
                  --stack-name "$STACK_NAME" \
                  --query 'Stacks[0].StackStatus' \
                  --output text 2>&1) || CURRENT_STATUS="Unknown"
                
                echo "Current stack status: $CURRENT_STATUS"
                
                echo ""
                echo "Checking stack events for more details..."
                aws cloudformation describe-stack-events \
                  --stack-name "$STACK_NAME" \
                  --max-items 5 \
                  --query 'StackEvents[].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
                  --output table 2>&1 || echo "Failed to get stack events"
                
                exit 1
              fi
            fi
          else
            echo "Stack does not exist, creating..."
            aws cloudformation create-stack \
              --stack-name "$STACK_NAME" \
              --template-body file://templates/main.yaml \
              --parameters file://$PARAMETER_FILE \
              --capabilities CAPABILITY_NAMED_IAM
            
            echo "Waiting for stack creation to complete..."
            aws cloudformation wait stack-create-complete --stack-name "$STACK_NAME"
          fi
          
          echo "✓ CloudFormation stack deployment completed"

      - name: Get S3 bucket name from CloudFormation
        id: get-s3-bucket
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`S3BucketName`].OutputValue' \
            --output text)
          if [ -z "$BUCKET_NAME" ] || [ "$BUCKET_NAME" == "None" ]; then
            echo "❌ Error: S3 bucket name not found in CloudFormation outputs"
            exit 1
          fi
          echo "bucket=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "S3 Bucket: $BUCKET_NAME"

      - name: Sync build files to S3
        run: |
          BUCKET_NAME="${{ steps.get-s3-bucket.outputs.bucket }}"
          
          echo "Syncing build files to S3 bucket: $BUCKET_NAME"
          
          # Static assets with long cache
          aws s3 sync build/ s3://$BUCKET_NAME/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "service-worker.js" \
            --exclude "manifest.json" \
            --exclude "*.map"
          
          # HTML files and service worker should not be cached
          aws s3 sync build/ s3://$BUCKET_NAME/ \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --include "service-worker.js" \
            --include "manifest.json"
          
          # Source maps (optional, for debugging)
          if find build -name "*.map" | grep -q .; then
            aws s3 sync build/ s3://$BUCKET_NAME/ \
              --cache-control "public, max-age=0, no-cache" \
              --include "*.map"
          fi
          
          echo "✓ Files synced to S3 successfully"

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
            --output text)
          
          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" == "None" ]; then
            echo "❌ Error: CloudFront Distribution ID not found in CloudFormation outputs"
            exit 1
          fi
          
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          
          echo "CloudFront invalidation created: $INVALIDATION_ID"
          echo "Waiting for invalidation to complete..."
          
          aws cloudfront wait invalidation-completed \
            --distribution-id $DISTRIBUTION_ID \
            --id $INVALIDATION_ID

      - name: Get CloudFront URL
        run: |
          CLOUDFRONT_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontURL`].OutputValue' \
            --output text)
          echo "🚀 Deployment completed!"
          echo "CloudFront URL: $CLOUDFRONT_URL"

