<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- グラデーション定義 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>

    <!-- 影のフィルター -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- 外側の円（メイン背景） -->
  <circle cx="16" cy="16" r="15" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- 内側の装飾円 -->
  <circle cx="16" cy="16" r="13" fill="url(#innerGradient)" opacity="0.6"/>
  
  <!-- 「マ」の文字 -->
  <g transform="translate(16,16)">
    <!-- 横線（上） -->
    <rect x="-7" y="-6" width="14" height="2" fill="white" rx="1"/>
    
    <!-- 縦線（左） -->
    <rect x="-6" y="-4" width="2" height="8" fill="white" rx="1"/>
    
    <!-- 縦線（右上から斜め） -->
    <rect x="4" y="-4" width="2" height="6" fill="white" rx="1"/>
    
    <!-- 横線（中央） -->
    <rect x="-4" y="-1" width="8" height="1.5" fill="white" rx="0.5"/>
    
    <!-- 下部の縦線 -->
    <rect x="1" y="2" width="2" height="4" fill="white" rx="1"/>
  </g>
  
  <!-- ハイライト効果 -->
  <circle cx="12" cy="10" r="2" fill="rgba(255,255,255,0.3)" opacity="0.8"/>
</svg> 